[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-reverse-proxy-router"
version = "0.1.0"
description = "Path and capability-based reverse proxy routing agent requests to specialized backend MCP microservices"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-reverse-proxy-router = "mcp_reverse_proxy_router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_reverse_proxy_router*"]
